<style>
  :root {
    --paper: #f5f8fc; --grid: rgba(47, 95, 170, 0.075); --card: #ffffff; --ink: #1b2640; --muted: #677390;
    --line: #d8e0ec; --accent: #2f54eb; --accent-ink: #ffffff; --mascot: #f5b82e; --crit: #a52525;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #121a2a; --grid: rgba(150, 180, 230, 0.06); --card: #1b2438; --ink: #e9edf6; --muted: #8e98b0;
      --line: #2e3a55; --accent: #7d9bff; --accent-ink: #0e1424; --mascot: #f6c445; --crit: #f07a7a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink); font: 400 16px/1.5 "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .gate { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; visibility: hidden; }
  body.ready .gate { visibility: visible; }
  h1 { font: 700 1.7rem/1.1 "Baloo 2", "Trebuchet MS", "Avenir Next Rounded", system-ui, sans-serif; margin: 0; }
  p { margin: 0; color: var(--muted); }
  form { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 8px; text-align: left; }
  label { font-weight: 500; font-size: 0.92rem; }
  input[type="password"] { width: 100%; font: 600 1.15rem/1 inherit; font-family: inherit; padding: 11px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); }
  input[type="password"]:focus { outline: none; border-color: var(--accent); }
  .rem { display: flex; align-items: center; gap: 8px; font-weight: 400; color: var(--muted); }
  button { font: 600 1.05rem/1 inherit; font-family: inherit; padding: 12px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: progress; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #msg { min-height: 1.5em; color: var(--crit); font-weight: 500; text-align: center; }
  .ft { fill: color-mix(in srgb, var(--mascot) 58%, white); } .fl { fill: var(--mascot); } .fr { fill: color-mix(in srgb, var(--mascot) 70%, black); }
  .cubo polygon { stroke: color-mix(in srgb, var(--mascot) 60%, black); stroke-width: 1.4; stroke-linejoin: round; }
  .mface { fill: #1b2640; } .mmouth { stroke: #1b2640; stroke-width: 2.4; fill: none; stroke-linecap: round; } .mcheek { fill: #f07a7a; opacity: 0.55; }
</style>

<script>
(async function () {
  var KEY = "cubo-site-key";
  var P = JSON.parse(document.getElementById("payload").textContent);
  var msg = document.getElementById("msg");
  var bytes = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var subtle = window.crypto && window.crypto.subtle;
  var show = function () { document.body.classList.add("ready"); document.getElementById("gate-pw").focus(); };

  var open = async function (key) {
    var plain = await subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));
    var html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  };

  if (!subtle) {
    show();
    msg.textContent = "This browser can't open the page. Use an up-to-date Chrome, Safari, Edge or Firefox.";
    document.getElementById("gate-go").disabled = true;
    return;
  }

  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      var k = await subtle.importKey("raw", bytes(saved), "AES-GCM", true, ["decrypt"]);
      await open(k);
      return;
    }
  } catch (e) {
    try { localStorage.removeItem(KEY); } catch (_) {}
  }
  show();

  document.getElementById("gate-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("gate-go");
    var pw = document.getElementById("gate-pw").value;
    btn.disabled = true;
    btn.textContent = "Opening…";
    msg.textContent = "";
    try {
      var base = await subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      var key = await subtle.deriveKey({ name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      var plain = await subtle.decrypt({ name: "AES-GCM", iv: bytes(P.iv) }, key, bytes(P.data));
      if (document.getElementById("gate-rem").checked) {
        try {
          var raw = new Uint8Array(await subtle.exportKey("raw", key));
          localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, raw)));
        } catch (_) {}
      }
      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "Open";
      msg.textContent = "That password didn't work. Check it and try again.";
      document.getElementById("gate-pw").select();
    }
  });
})();
</script>
